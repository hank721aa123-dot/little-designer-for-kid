<title>小小服装设计师</title>
<style>
/* ===== 小小服装设计师 ===== */
:root {
  --bg: #FFF6E5;
  --card: #FFFFFF;
  --ink: #4A3F35;
  --ink2: #8B7B68;
  --accent: #FF9F40;
  --accent-d: #F28A1E;
  --yellow: #FFD166;
  --ok: #5CD65C;
  --pink: #FF8EC7;
  --blue: #4DABF7;
  --line: #EFE3CE;
  --shadow: 0 4px 0 rgba(0, 0, 0, .08);
  --r: 22px;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0; padding: 0; height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
    "Microsoft YaHei", "Source Han Sans SC", sans-serif;
  user-select: none;
  -webkit-user-select: none;
}

#app { height: 100dvh; height: 100vh; display: flex; flex-direction: column; }

/* ---------- 通用 ---------- */
.screen { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.pad { padding: 12px 16px; }
.center { display: flex; align-items: center; justify-content: center; }

.btn {
  border: none; border-radius: var(--r);
  background: var(--card); color: var(--ink);
  font-size: 19px; font-weight: 700; font-family: inherit;
  padding: 16px 20px; min-height: 72px;
  box-shadow: var(--shadow); cursor: pointer;
  transition: transform .12s, box-shadow .12s;
  display: flex; align-items: center; justify-content: center; gap: 10px;
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.08); }
.btn-primary { background: var(--accent); color: #fff; }
.btn-yellow { background: var(--yellow); color: #6B4A2F; }
.btn-ok { background: var(--ok); color: #fff; }
.btn-ghost { background: rgba(255,255,255,.72); }
.btn-sm { min-height: 56px; font-size: 16px; padding: 12px 16px; border-radius: 16px; }
.btn[disabled] { opacity: .45; }

.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: calc(env(safe-area-inset-top) + 10px) 16px 10px;
  gap: 10px;
}
.topbar h1 { margin: 0; font-size: 20px; font-weight: 800; }
.pill {
  background: rgba(255,255,255,.85); border-radius: 999px;
  padding: 8px 14px; font-size: 15px; font-weight: 700;
  display: flex; align-items: center; gap: 6px; box-shadow: var(--shadow);
}
.pill.star { color: #E8A317; }

/* ---------- 首页 ---------- */
.home { gap: 14px; align-items: center; justify-content: center; padding: 20px; }
.home-title { font-size: 34px; font-weight: 900; text-align: center; line-height: 1.15; margin: 0; }
.home-sub { font-size: 16px; color: var(--ink2); text-align: center; margin: 0; }
.home-mascot { width: min(52vw, 240px); animation: float 3s ease-in-out infinite; }
@keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
.home-btns { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 320px; }

/* ---------- 选角色 ---------- */
.grid2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.card {
  background: var(--card); border-radius: var(--r); padding: 12px;
  box-shadow: var(--shadow); text-align: center; cursor: pointer;
  border: 4px solid transparent; transition: transform .12s;
}
.card:active { transform: scale(.97); }
.card.sel { border-color: var(--accent); }
.card.locked { opacity: .5; }
.card-avatar { width: 100%; height: 92px; }
.card-name { font-size: 17px; font-weight: 800; margin-top: 2px; }
.card-sub { font-size: 12px; color: var(--ink2); }

/* ---------- 任务列表 ---------- */
.task-list { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 4px 16px 16px; }
.task {
  display: flex; align-items: center; gap: 12px;
  background: var(--card); border-radius: 18px; padding: 14px; margin-bottom: 10px;
  box-shadow: var(--shadow); cursor: pointer; min-height: 84px;
}
.task:active { transform: scale(.99); }
.task-no {
  width: 52px; height: 52px; border-radius: 16px; flex: none;
  background: var(--yellow); color: #6B4A2F;
  font-size: 22px; font-weight: 900; display: flex; align-items: center; justify-content: center;
}
.task.done .task-no { background: var(--ok); color: #fff; }
.task-body { flex: 1; min-width: 0; }
.task-title { font-size: 17px; font-weight: 800; }
.task-hint { font-size: 13px; color: var(--ink2); margin-top: 2px; }
.task-tag { font-size: 11px; background: var(--bg); border-radius: 999px; padding: 3px 9px; color: var(--ink2); display: inline-block; margin-top: 5px; }

/* ---------- 舞台 ---------- */
.stage {
  flex: none; position: relative; margin: 0 12px;
  border-radius: 26px; overflow: hidden; background: #fff;
  box-shadow: var(--shadow); height: 32vh; min-height: 200px;
}
.stage svg { width: 100%; height: 100%; display: block; }
.stage-word {
  position: absolute; top: 10px; right: 10px;
  background: rgba(255,255,255,.94); border-radius: 16px;
  padding: 8px 12px; text-align: center; box-shadow: var(--shadow);
  animation: pop .28s cubic-bezier(.2,1.4,.5,1);
}
@keyframes pop { 0%{transform:scale(.5);opacity:0} 100%{transform:scale(1);opacity:1} }
.sw-char { font-size: 30px; font-weight: 900; line-height: 1; }
.sw-py { font-size: 12px; color: var(--ink2); font-weight: 700; }

.tip {
  margin: 10px 16px 0; background: #fff; border-radius: 16px;
  padding: 11px 14px; font-size: 15px; font-weight: 700; text-align: center;
  box-shadow: var(--shadow);
}

/* ---------- 底部托盘：衣橱横滑 + 色板吸底 ---------- */
.tray { display: flex; flex-direction: column; min-height: 0; padding: 6px 12px calc(env(safe-area-inset-bottom) + 6px); }
.tray-top { display: flex; gap: 8px; align-items: center; }
.slots { display: flex; gap: 6px; flex: 1; }
.slot {
  flex: 1; min-height: 52px; border-radius: 12px; border: none;
  background: rgba(255,255,255,.7); font-family: inherit;
  font-size: 12px; font-weight: 800; color: var(--ink2);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  cursor: pointer; padding: 4px 2px;
}
.slot.on { background: var(--accent); color: #fff; }
.slot .dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgba(0,0,0,.15); }
/* 配饰槽位计数（>1 件时显示在名字右侧） */
.slot-badge {
  display: inline-block; margin-left: 4px;
  min-width: 18px; height: 18px; line-height: 18px; border-radius: 9px;
  background: var(--ok); color: #fff; font-size: 11px; font-weight: 900;
  padding: 0 5px;
}

/* 衣橱：横向滚动 + 滚动锚定 */
.items {
  flex: none; margin: 8px -4px 0; padding: 4px 4px 8px;
  overflow-x: auto; overflow-y: hidden;
  -webkit-overflow-scrolling: touch;
  scroll-snap-type: x mandatory;
  scrollbar-width: none; /* Firefox 隐藏 */
}
.items::-webkit-scrollbar { display: none; }  /* Chrome/Safari 隐藏 */
.item-row {
  display: flex; gap: 8px;
  padding: 4px 0;
}
.item {
  flex: 0 0 76px;
  background: #fff; border-radius: 14px; padding: 8px 4px; text-align: center;
  box-shadow: var(--shadow); cursor: pointer; border: 3px solid transparent;
  min-height: 90px; display: flex; flex-direction: column; align-items: center; justify-content: center;
  scroll-snap-align: start;
}
.item:active { transform: scale(.95); }
.item.on { border-color: var(--accent); }
/* .need 高亮已停用：孩子自己决定穿什么，不再用 ★ 提示目标服饰 */
.item-ic { width: 36px; height: 36px; color: var(--ink); }
.item-nm { font-size: 11px; font-weight: 700; margin-top: 2px; }
.item-w { font-size: 10px; font-weight: 800; color: var(--ink2); }
/* 多选已勾标记 */
.item { position: relative; }
.item-check {
  position: absolute; top: 4px; right: 6px;
  width: 18px; height: 18px; line-height: 18px; border-radius: 50%;
  background: var(--ok); color: #fff; font-size: 12px; font-weight: 900;
}
/* acc 行首的「取下全部」 */
.item.acc-clear { color: var(--ink2); border-style: dashed; }
.item.acc-clear .item-ic { font-size: 22px; line-height: 36px; font-weight: 900; }
.sw.sw-clear {
  background:
    linear-gradient(45deg, transparent 45%, #999 47%, #999 53%, transparent 55%),
    #fff;
}

/* 色板：吸底常驻，不再被衣服遮挡 */
.palette-bar {
  display: flex; gap: 7px; justify-content: center; align-items: center;
  padding: 4px 12px; margin: 0 -12px;
  background: rgba(255, 246, 229, .85);
  border-top: 1px solid var(--line);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
.sw {
  width: 36px; height: 36px; border-radius: 50%; border: 3px solid #fff;
  box-shadow: 0 2px 6px rgba(0,0,0,.18); cursor: pointer;
}
.sw.on { border-color: var(--ink); transform: scale(1.15); }

/* 「完成啦」按钮：常驻右下，随时可点，避免挡住主区 */
.fab-finish {
  position: fixed; right: 14px; bottom: calc(env(safe-area-inset-bottom) + 70px);
  min-width: 96px; min-height: 56px; border-radius: 28px;
  background: var(--ok); color: #fff;
  font-size: 16px; font-weight: 900; border: none; cursor: pointer;
  box-shadow: var(--shadow); z-index: 15;
  display: flex; align-items: center; justify-content: center;
  transition: transform .12s;
}
.fab-finish:active { transform: scale(.94); }
.fab-finish.miss { background: var(--yellow); color: #6B4A2F; }

/* ---------- 通用题面 ---------- */
.quiz { flex: 1; display: flex; flex-direction: column; padding: 14px 16px calc(env(safe-area-inset-bottom) + 14px); gap: 12px; }
.q-prompt { font-size: 20px; font-weight: 900; text-align: center; }
.q-big { font-size: 76px; font-weight: 900; text-align: center; line-height: 1; margin: 4px 0; }
.q-opts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.q-opt {
  background: #fff; border-radius: 20px; min-height: 108px; border: 4px solid transparent;
  box-shadow: var(--shadow); cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
}
.q-opt:active { transform: scale(.96); }
.q-opt.on { border-color: var(--ok); }
.q-opt.bad { animation: shake .4s; }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }
.q-ic { width: 56px; height: 56px; color: var(--ink); }
.q-lb { font-size: 15px; font-weight: 800; }
.q-seq { display: flex; gap: 10px; justify-content: center; align-items: center; }
.seq-d { width: 46px; height: 46px; border-radius: 50%; border: 3px solid rgba(0,0,0,.12); }
.seq-q { font-size: 34px; font-weight: 900; color: var(--ink2); }
.count-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; min-height: 60px; align-items: center; }
.count-n { font-size: 40px; font-weight: 900; text-align: center; }
.tap-big {
  width: 120px; height: 120px; border-radius: 50%; border: none;
  background: var(--yellow); box-shadow: var(--shadow); cursor: pointer;
  display: flex; align-items: center; justify-content: center; margin: 0 auto;
  animation: breathe 1.8s ease-in-out infinite;
}
.tap-big:active { transform: scale(.94); }
@keyframes breathe { 0%,100%{transform:scale(1)} 50%{transform:scale(1.06)} }
.sent { display: flex; gap: 8px; justify-content: center; align-items: center; flex-wrap: wrap; }
.sent-c {
  width: 62px; height: 62px; border-radius: 14px; background: #fff; box-shadow: var(--shadow);
  display: flex; align-items: center; justify-content: center;
  font-size: 30px; font-weight: 900;
}
.sent-c.blank { border: 3px dashed var(--accent); color: var(--accent); }

/* ---------- 印章 / 反馈 ---------- */
.overlay {
  position: fixed; inset: 0; background: rgba(74,63,53,.55);
  display: flex; align-items: center; justify-content: center; padding: 24px; z-index: 50;
}
.modal {
  background: #fff; border-radius: 28px; padding: 24px; width: 100%; max-width: 340px;
  text-align: center; box-shadow: 0 12px 40px rgba(0,0,0,.25);
  animation: pop .3s cubic-bezier(.2,1.4,.5,1);
}
.modal h2 { margin: 0 0 6px; font-size: 23px; font-weight: 900; }
.modal p { margin: 0 0 14px; font-size: 15px; color: var(--ink2); }
.stamp {
  width: 132px; height: 132px; margin: 6px auto 12px; border-radius: 26px;
  border: 6px solid var(--pink); color: var(--pink);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  transform: rotate(-8deg); animation: stampIn .45s cubic-bezier(.2,1.6,.4,1);
}
@keyframes stampIn { 0%{transform:rotate(-30deg) scale(2.2);opacity:0} 60%{opacity:1} 100%{transform:rotate(-8deg) scale(1);opacity:1} }
.stamp-c { font-size: 62px; font-weight: 900; line-height: 1; }
.stamp-p { font-size: 15px; font-weight: 800; }
.praise { background: var(--bg); border-radius: 16px; padding: 12px; font-size: 16px; font-weight: 700; margin-bottom: 12px; }

/* ---------- 作品集 ---------- */
.works { flex: 1; overflow-y: auto; padding: 4px 16px 16px; }
.works-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.work { background: #fff; border-radius: 18px; overflow: hidden; box-shadow: var(--shadow); cursor: pointer; }
.work svg { width: 100%; height: 150px; display: block; background: #fff; }
.work-ft { padding: 8px; font-size: 12px; color: var(--ink2); text-align: center; font-weight: 700; }

/* ---------- 集章册 ---------- */
.books { flex: 1; overflow-y: auto; padding: 4px 16px 16px; }
.book-lv { margin-bottom: 14px; }
.book-hd { font-size: 15px; font-weight: 800; margin-bottom: 8px; display: flex; justify-content: space-between; }
.book-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.chip {
  aspect-ratio: 1; border-radius: 14px; background: #fff; box-shadow: var(--shadow);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  font-size: 21px; font-weight: 900;
}
.chip.locked { background: rgba(255,255,255,.5); color: #D8CDBA; }
.chip small { font-size: 9px; font-weight: 700; color: var(--ink2); }
.chip.got { color: var(--pink); }

/* ---------- 家长中心 ---------- */
.pc { flex: 1; overflow-y: auto; padding: 4px 16px calc(env(safe-area-inset-bottom) + 20px); }
.row {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  background: #fff; border-radius: 16px; padding: 14px; margin-bottom: 10px; box-shadow: var(--shadow);
  min-height: 64px;
}
.row-l { font-size: 16px; font-weight: 800; }
.row-s { font-size: 12px; color: var(--ink2); font-weight: 600; margin-top: 2px; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button {
  border: none; background: var(--bg); color: var(--ink); font-family: inherit;
  font-size: 15px; font-weight: 800; padding: 10px 14px; border-radius: 12px; min-height: 46px; cursor: pointer;
}
.seg button.on { background: var(--accent); color: #fff; }
.warn { background: #FFF3E0; border-radius: 14px; padding: 12px; font-size: 13px; color: #8A5A20; margin-bottom: 10px; line-height: 1.5; }
.hold {
  position: fixed; right: 14px; bottom: calc(env(safe-area-inset-bottom) + 14px);
  width: 58px; height: 58px; border-radius: 50%; border: none;
  background: rgba(255,255,255,.8); font-size: 22px; cursor: pointer;
  box-shadow: var(--shadow); z-index: 20;
}
.hold-prog {
  position: fixed; right: 14px; bottom: calc(env(safe-area-inset-bottom) + 14px);
  width: 58px; height: 58px; border-radius: 50%; pointer-events: none; z-index: 21;
  background: conic-gradient(var(--accent) var(--p, 0deg), transparent 0);
  -webkit-mask: radial-gradient(circle, transparent 60%, #000 61%);
  mask: radial-gradient(circle, transparent 60%, #000 61%);
}
.sleep { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; text-align: center; }
.sleep-emo { font-size: 76px; animation: float 3s ease-in-out infinite; }

.empty { text-align: center; color: var(--ink2); font-size: 15px; padding: 40px 20px; line-height: 1.7; }

</style>

<script>

/* ===== words.js ===== */
/**
 * 字库：1000 字，分 10 级
 *
 * 设计原则：收录范围取自现代汉语常用字；教学顺序按「具象程度 + 幼儿口语熟悉度」
 * 重排，而非按字频机械排序 —— 频序前 100 字里大量虚词（的、了、是、在…）
 * 既配不出图、4 岁也理解不了，因此被下沉到 L9-L10。
 *
 * 紧凑格式：'字 拼音 词例'，条目间用 ' / ' 分隔
 *   lv  级别 1-10（L1 最具体，L10 最抽象）
 *   cat 语义分类
 *   f   常用度 A=极常用 B=常用 C=次常用
 */
const RAW_WORDS = [
  /* ========== L1 具象·身边（4-5岁）========== */
  { lv: 1, cat: '穿戴', f: 'A', s: '衣 yī 衣服 / 帽 mào 帽子 / 鞋 xié 鞋子 / 袜 wà 袜子 / 裤 kù 裤子 / 裙 qún 裙子 / 衫 shān 衬衫 / 巾 jīn 围巾 / 带 dài 腰带 / 布 bù 花布' },
  { lv: 1, cat: '颜色', f: 'A', s: '红 hóng 红色 / 黄 huáng 黄色 / 蓝 lán 蓝色 / 绿 lǜ 绿色 / 白 bái 白色 / 黑 hēi 黑色 / 粉 fěn 粉色 / 橙 chéng 橙色 / 紫 zǐ 紫色 / 灰 huī 灰色' },
  { lv: 1, cat: '身体', f: 'A', s: '头 tóu 点头 / 手 shǒu 小手 / 脚 jiǎo 小脚 / 眼 yǎn 眼睛 / 耳 ěr 耳朵 / 口 kǒu 张口 / 鼻 bí 鼻子 / 牙 yá 牙齿 / 发 fà 头发 / 脸 liǎn 笑脸' },
  { lv: 1, cat: '家人', f: 'A', s: '爸 bà 爸爸 / 妈 mā 妈妈 / 爷 yé 爷爷 / 奶 nǎi 奶奶 / 哥 gē 哥哥 / 姐 jiě 姐姐 / 弟 dì 弟弟 / 妹 mèi 妹妹 / 娃 wá 娃娃 / 宝 bǎo 宝宝' },
  { lv: 1, cat: '动物', f: 'A', s: '熊 xióng 小熊 / 兔 tù 兔子 / 猫 māo 小猫 / 狗 gǒu 小狗 / 鸟 niǎo 小鸟 / 鱼 yú 小鱼 / 虫 chóng 虫子 / 马 mǎ 小马 / 牛 niú 奶牛 / 羊 yáng 小羊' },
  { lv: 1, cat: '自然', f: 'A', s: '日 rì 生日 / 月 yuè 月亮 / 星 xīng 星星 / 云 yún 白云 / 雨 yǔ 下雨 / 雪 xuě 雪花 / 风 fēng 大风 / 水 shuǐ 喝水 / 火 huǒ 火车 / 山 shān 大山' },

      `<ellipse cx="150" cy="166" rx="15" ry="28" fill="${o.b}" stroke="${o.s}" stroke-width="4"/>`,
  };
}

/** 任务完成判定：outfit 是否满足 require（outfit[slot] 存的是服饰 id 字符串） */
function checkRequire(outfit, require) {
  if (!require) return true;
  for (const slot of Object.keys(require)) {
    const id = outfit[slot];
    if (!id) return false;
    const def = CLOTH_MAP[id];
    if (!def) return false;
    const needTags = require[slot];
    const ok = needTags.some((t) => (def.tags || []).indexOf(t) >= 0);
    if (!ok) return false;
  }
  return true;
}


/* ===== storage.js ===== */
/**
 * 存储层
 *
 * 关键约束：安卓 Chrome 在 file:// 下 localStorage 可用，但按文件路径隔离。
 * 因此必须提示用户把文件放在固定目录、从同一路径打开，否则存档会丢。
 * 作品集只存结构化 JSON（不存图片），缩略图运行时重渲染，100 件仅数十 KB。
 */

const DEFAULT_DATA = {
  v: 1,
  stars: 0,
  level: 1,            // 当前字表级别 1-10
  learned: [],         // 已获得的汉字印章
  works: [],           // 作品集（结构化 JSON）
  doneTasks: [],       // 已完成的任务 id
  today: { date: '', ms: 0 },
  settings: {
    dailyLimit: 30,    // 每日总量（分钟）
    sessionLimit: 15,  // 单次时长（分钟）
    sleepStart: '21:00',
    sleepEnd: '07:00',
  },
  praise: '',          // 家长录的鼓励语
};

const Storage = {
  available: false,
  reason: '',
  data: null,

  init() {
    try {
      const k = '__t__' + Date.now();
      window.localStorage.setItem(k, '1');
      window.localStorage.removeItem(k);
      this.available = true;
    } catch (e) {
      this.available = false;
      this.reason = '浏览器禁用了本地存储';
    }
    this.load();
    return this.available;
  },

  load() {
    let d = null;
    if (this.available) {
      try {
        const raw = window.localStorage.getItem('dressup_v1');
        if (raw) d = JSON.parse(raw);
      } catch (e) { d = null; }
    }
    this.data = Object.assign({}, DEFAULT_DATA, d || {});
    // 补齐嵌套字段
    this.data.today = Object.assign({ date: '', ms: 0 }, this.data.today);
    this.data.settings = Object.assign({}, DEFAULT_DATA.settings, this.data.settings);
    /* 旧版本：acc 是字符串；新版本是数组。统一升格，老存档自动兼容 */
    for (const w of this.data.works) {
      const o2 = w.outfit || {};
      if (typeof o2.acc === 'string') o2.acc = o2.acc ? [o2.acc] : [];
      else if (!o2.acc) o2.acc = [];
    }
    this.rollDate();
  },

  save() {
    if (!this.available) return false;
    try {
      window.localStorage.setItem('dressup_v1', JSON.stringify(this.data));
      return true;
    } catch (e) {
      // 容量满：先砍掉一半最老的作品再试
      if (this.data.works.length > 10) {
        this.data.works = this.data.works.slice(0, Math.floor(this.data.works.length / 2));
        try {
          window.localStorage.setItem('dressup_v1', JSON.stringify(this.data));
          return true;
        } catch (e2) { /* 放弃 */ }
      }
      this.available = false;
      this.reason = '存储空间不足';
      return false;
    }
  },

  /** 跨天重置今日时长 */
  rollDate() {
    const t = new Date();
    const key = t.getFullYear() + '-' + (t.getMonth() + 1) + '-' + t.getDate();
    if (this.data.today.date !== key) {
      this.data.today = { date: key, ms: 0 };
      this.save();
    }
  },

  addToday(ms) {
    this.rollDate();
    this.data.today.ms += ms;
    this.save();
  },

  todayMinutes() { return this.data.today.ms / 60000; },

  addWork(w) {
    this.data.works.unshift(w);
    if (this.data.works.length > 200) this.data.works.length = 200;
    this.save();
  },

  addStar(n) {
    this.data.stars += (n || 1);
    this.save();
  },

  addLearned(c) {
    if (this.data.learned.indexOf(c) < 0) {
      this.data.learned.push(c);
      this.save();
      return true;   // 新学会
    }
    return false;
  },

  /* ---------- 作品集导出 / 导入兜底 ---------- */
  exportJSON() {
    return JSON.stringify({
      app: 'dressup', v: 1, exportedAt: new Date().toISOString(),
      stars: this.data.stars, level: this.data.level,
      learned: this.data.learned, works: this.data.works,
      doneTasks: this.data.doneTasks, settings: this.data.settings,
      praise: this.data.praise,
    });
  },

  importJSON(str) {
    try {
      const o = JSON.parse(str);
      if (!o || o.app !== 'dressup') return { ok: false, msg: '不是本游戏的存档文件' };
      this.data.stars = o.stars || 0;
      this.data.level = o.level || 1;
      this.data.learned = o.learned || [];
      /* 历史存档：acc 是字符串；新存档：acc 是数组。统一升格为数组，老作品不受影响 */
      this.data.works = (o.works || []).map((w) => {
        const o2 = w.outfit || {};
        if (o2 && typeof o2.acc === 'string') o2.acc = o2.acc ? [o2.acc] : [];
        else if (!o2) w.outfit = { top: null, bottom: null, shoes: null, hat: null, acc: [] };
        else if (!Array.isArray(o2.acc)) o2.acc = [];
        return w;
      });
      this.data.doneTasks = o.doneTasks || [];
      this.data.settings = Object.assign({}, DEFAULT_DATA.settings, o.settings || {});
      this.data.praise = o.praise || '';
      this.save();
      return { ok: true, msg: '已恢复 ' + this.data.works.length + ' 件作品、' + this.data.learned.length + ' 个字' };
    } catch (e) {
      return { ok: false, msg: '文件读不出来：' + e.message };
    }
  },
};


/* ===== speech.js ===== */
/**
 * 语音（汉字发音）
 *
 * 依赖设备是否安装中文离线语音包：安卓部分机型默认没装 → 无声。
 * 策略：启动时检测，有则朗读（语速放慢、音调略高，接近童声）；
 * 没有则完全静默降级，汉字照常图文显示，绝不报错。
 * 关键引导一律辅以视觉动画，不依赖声音。
 */

const Speech = {
  ok: false,
  voice: null,
  enabled: true, // 家长中心可关

  init() {
    if (!('speechSynthesis' in window)) { this.ok = false; return false; }
    const pick = () => {
      let vs = [];
      try { vs = window.speechSynthesis.getVoices() || []; } catch (e) { vs = []; }
      if (!vs.length) return false;
      // 优先本地（离线）中文语音，其次任意中文语音
      const zh = vs.filter((v) => /^zh/i.test(v.lang || ''));
      const local = zh.filter((v) => v.localService);
      this.voice = local[0] || zh[0] || null;
      this.ok = !!this.voice;
      return this.ok;
    };
    if (pick()) return true;
    // 部分浏览器首次 getVoices 为空，需等 voiceschanged
    try {
      window.speechSynthesis.onvoiceschanged = () => { pick(); };
      // 兜底轮询
      let n = 0;
      const t = setInterval(() => {
        if (pick() || ++n > 20) clearInterval(t);
      }, 250);
    } catch (e) { /* 忽略 */ }
    return false;
  },

  speak(text) {
    if (!this.ok || !this.enabled || !text) return;
    try {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(String(text));
      if (this.voice) u.voice = this.voice;
      u.lang = (this.voice && this.voice.lang) || 'zh-CN';
      u.rate = 0.8;   // 放慢，4 岁听得清
      u.pitch = 1.25; // 略高，童声感
      u.volume = 1;
      window.speechSynthesis.speak(u);
    } catch (e) { /* 静默失败，不影响游戏 */ }
  },

  stop() {
    try { window.speechSynthesis.cancel(); } catch (e) { /* 忽略 */ }
  },
};


/* ===== parent.js ===== */
/**
 * 家长中心与防沉迷
 *
 * 四道闸门：
 *   1. 单次时长（默认 15 分钟）到点走"收尾仪式"，不是硬弹窗
 *   2. 每日总量（家长可调 20/30/45/60 分钟）到时当日锁玩
 *   3. 睡眠时段（默认 21:00-07:00）打开直显"睡觉时间"
 *   4. 护眼休息：每 15 分钟提示看远处，可跳过
 *
 * 家长中心防误入：长按 3 秒 + 算术题（4 岁既长按不住，也不会算术）
 */

function _toMin(hhmm) {
  const p = String(hhmm || '00:00').split(':');
  return (parseInt(p[0], 10) || 0) * 60 + (parseInt(p[1], 10) || 0);
}

const Parent = {
  sessionMs: 0,      // 本次连续游玩时长
  eyeMs: 0,          // 距上次护眼提醒
  last: 0,
  paused: false,
  onLimit: null,     // 触达限制时的回调
  onEye: null,

  reset() {
    this.sessionMs = 0;
    this.eyeMs = 0;
    this.last = Date.now();
    this.paused = false;
  },

  /** 每 500ms 调一次；返回 true 表示本次仍可继续玩 */
  tick() {
    const now = Date.now();
    if (!this.last) this.last = now;
    const dt = now - this.last;
    this.last = now;
    if (this.paused) return true;

    this.sessionMs += dt;
    this.eyeMs += dt;
    Storage.addToday(dt);   // 只写入当日累计，会话时长不落盘

    const s = Storage.data.settings;
    const sessLimit = (s.sessionLimit || 15) * 60000;
    const dayLimit = (s.dailyLimit || 30) * 60000;
    const eyeLimit = 15 * 60000;

    if (this.eyeMs >= eyeLimit) {
      this.eyeMs = 0;
      if (this.onEye) this.onEye();
      return true;
    }
    if (this.sessionMs >= sessLimit) {
      this.paused = true;
      if (this.onLimit) this.onLimit('session');
      return false;
    }
    if (Storage.data.today.ms >= dayLimit) {
      this.paused = true;
      if (this.onLimit) this.onLimit('daily');
      return false;
    }
    return true;
  },

  pause() { this.paused = true; },
  resume() { this.paused = false; this.last = Date.now(); },
  /** 家长临时延长：重置单次计时 */
  extend() { this.sessionMs = 0; this.paused = false; this.last = Date.now(); },

  sessionLeftSec() {
    const s = Storage.data.settings;
    return Math.max(0, Math.round((s.sessionLimit * 60000 - this.sessionMs) / 1000));
  },
  todayLeftSec() {
    const s = Storage.data.settings;
    return Math.max(0, Math.round((s.dailyLimit * 60000 - Storage.data.today.ms) / 1000));
  },

  /** 是否在睡眠时段（支持跨天，如 21:00-07:00） */
  inSleep() {
    const s = Storage.data.settings;
    const m = new Date().getHours() * 60 + new Date().getMinutes();
    const a = _toMin(s.sleepStart), b = _toMin(s.sleepEnd);
    if (a === b) return false;
    return a > b ? (m >= a || m < b) : (m >= a && m < b);
  },

  /** 进入游戏前的闸门判定 */
  canPlay() {
    if (this.inSleep()) return { ok: false, reason: 'sleep' };
    const s = Storage.data.settings;
    if (Storage.data.today.ms >= s.dailyLimit * 60000) return { ok: false, reason: 'daily' };
    return { ok: true };
  },

  /** 生成防误入算术题 */
  makeQuiz() {
    const a = 2 + Math.floor(Math.random() * 6);   // 2-7
    const b = 1 + Math.floor(Math.random() * 5);   // 1-5
    const ans = a + b;
    const opts = [ans];
    let guard = 0;
    while (opts.length < 4 && guard++ < 60) {
      const x = ans + Math.floor(Math.random() * 7) - 3;
      if (x > 0 && opts.indexOf(x) < 0) opts.push(x);
    }
    while (opts.length < 4) opts.push(opts.length + 1);
    // 洗牌
    for (let i = opts.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = opts[i]; opts[i] = opts[j]; opts[j] = t;
    }
    return { q: a + ' + ' + b + ' = ?', ans: ans, opts: opts };
  },
};

/**
 * 主逻辑：状态机 / 渲染 / 交互
 * 所有点击走事件委托（data-act + data-v），避免大量绑定
 */

const App = {
  el: null,
  state: 'home',          // home | char | tasks | play | quiz | works | books | parent | sleep | rest | eye
  charId: 'bear',
  sceneId: 'room',
  outfit: { top: null, bottom: null, shoes: null, hat: null, acc: [] },
  colors: { top: '#FF6B6B', bottom: '#4DABF7', shoes: '#FFD43B', hat: '#FF8EC7', acc: '#69DB7C' },
  colorsByAcc: {},         /* 多件配饰各自配色，未指定回落到 colors.acc */
  curSlot: 'top',
  task: null,
  popWord: null,
  count: 0,
  chosen: [],
  free: false,
  toldStoreWarn: false,

  /* ================= 启动 ================= */
  init() {
    this.el = document.getElementById('app');
    Storage.init();
    Speech.init();

    Parent.onLimit = (why) => { this.state = 'rest'; this.restWhy = why; this.render(); };
    Parent.onEye = () => { if (this.state === 'play' || this.state === 'quiz') { this.prevState = this.state; this.state = 'eye'; this.render(); } };

    // 整个 document 都能响应点击（modal 在 body 上）
    document.addEventListener('click', (e) => {
      const t = e.target.closest && e.target.closest('[data-act]');
      if (t) this.handle(t.dataset.act, t.dataset.v, t);
    });

    // 家长中心入口：长按 3 秒
    this.bindHold();

    setInterval(() => {
      if (this.state === 'play' || this.state === 'quiz') Parent.tick();
    }, 500);

    // 首次进入先过闸门
    const g = Parent.canPlay();
    this.state = g.ok ? 'home' : (g.reason === 'sleep' ? 'sleep' : 'rest');
    this.restWhy = g.reason === 'sleep' ? '' : 'daily';
    this.render();

    if (!Storage.available && !this.toldStoreWarn) {
      this.toldStoreWarn = true;
      setTimeout(() => this.modal(
        '存档可能保不住',
        '本机浏览器不允许保存进度。请换用 <b>Chrome / 浏览器</b> 打开，并把文件放在固定文件夹里、每次从同一位置打开。',
        [{ t: '知道了', a: 'closeModal', c: 'btn-primary' }]
      ), 600);
    }
  },

  bindHold() {
    let timer = null, prog = null, start = 0;
    const begin = (e) => {
      if (this.state === 'parent') return;
      start = Date.now();
      prog = document.createElement('div');
      prog.className = 'hold-prog';
      document.body.appendChild(prog);
      const step = () => {
        const p = Math.min(1, (Date.now() - start) / 3000);
        if (prog) prog.style.setProperty('--p', (p * 360) + 'deg');
        if (p < 1) timer = requestAnimationFrame(step);
        else { end(true); }
      };
      timer = requestAnimationFrame(step);
      e.preventDefault();
    };
    const end = (done) => {
      if (timer) cancelAnimationFrame(timer);
      timer = null;
      if (prog) { prog.remove(); prog = null; }
      if (done) { Speech.stop(); this.state = 'parent'; this.render(); }
    };
    document.addEventListener('touchstart', (e) => {
      if (e.target.closest && e.target.closest('.hold')) begin(e);
    }, { passive: false });
    document.addEventListener('touchend', () => end(false));
    document.addEventListener('touchcancel', () => end(false));
    document.addEventListener('mousedown', (e) => {
      if (e.target.closest && e.target.closest('.hold')) begin(e);
    });
    document.addEventListener('mouseup', () => end(false));
  },

  /* ================= 工具 ================= */
  icon(c, size) {
    const b = ICONS[c];
    if (!b) return '<div style="width:' + size + 'px;height:' + size + 'px"></div>';
    return '<svg viewBox="0 0 48 48" width="' + size + '" height="' + size + '" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">' + b + '</svg>';
  },

  charSVG(charId, outfit, colors, sceneId, cls) {
    const ch = CHARACTERS.filter((c) => c.id === charId)[0] || CHARACTERS[0];
    const L = ch.layers;
    const sc = SCENES.filter((s) => s.id === sceneId)[0] || SCENES[0];
    let s = '<svg viewBox="' + CH_VIEWBOX + '"' + (cls ? ' class="' + cls + '"' : '') + ' xmlns="http://www.w3.org/2000/svg">';
    s += '<rect width="200" height="260" fill="' + sc.bg + '"/>' + sc.decor;
    s += L.ears + L.legs + L.body + L.arms;
    if (outfit.top) s += this.clothSVG(outfit.top, colors.top);
    s += L.head + L.face;
    if (outfit.bottom) s += this.clothSVG(outfit.bottom, colors.bottom);
    if (outfit.shoes) s += this.clothSVG(outfit.shoes, colors.shoes);
    if (outfit.hat) s += this.clothSVG(outfit.hat, colors.hat);
    /* 配饰支持多件：从底到顶依次叠 */
    const accs = Array.isArray(outfit.acc) ? outfit.acc : (outfit.acc ? [outfit.acc] : []);
    for (let i = 0; i < accs.length; i++) {
      const id = accs[i];
      const col = (colors.accById && colors.accById[id]) || colors.acc;
      s += this.clothSVG(id, col);
    }
    return s + '</svg>';
  },

  clothSVG(id, color) {
    const d = CLOTH_MAP[id];
    if (!d) return '';
    return d.svg.replace(/\{c\}/g, color || '#FF6B6B');
  },

  /** 当前可见的字（只暴露当前级别，更高级别对 4 岁完全不可见） */
  visibleWords() {
    const lv = Storage.data.level;
    return WORDS.filter((w) => w.lv <= lv);
  },

  unlockedChars() {
    const st = Storage.data.stars;
    return CHARACTERS.filter((c) => st >= c.unlockStars);
  },
  unlockedScenes() {
    const st = Storage.data.stars;
    return SCENES.filter((s) => st >= s.unlockStars);
  },

  bar(title, back) {
    return '<div class="topbar"><button class="btn btn-sm btn-ghost" data-act="go" data-v="' + back + '">← 返回</button>'
      + '<h1>' + title + '</h1>'
      + '<div class="pill star">★ ' + Storage.data.stars + '</div></div>';
  },

  /* ================= 渲染 ================= */
  render() {
    const s = this.state;
    let html = '';
    if (s === 'home') html = this.viewHome();
    else if (s === 'char') html = this.viewChar();
    else if (s === 'tasks') html = this.viewTasks();
    else if (s === 'play') html = this.viewPlay();
    else if (s === 'quiz') html = this.viewQuiz();
    else if (s === 'works') html = this.viewWorks();
    else if (s === 'books') html = this.viewBooks();
    else if (s === 'parent') html = this.viewParent();
    else if (s === 'sleep') html = this.viewSleep();
    else if (s === 'rest') html = this.viewRest();
    else if (s === 'eye') html = this.viewEye();
    this.el.innerHTML = html;
  },

  viewHome() {
    const ch = CHARACTERS[0];
    return '<div class="screen home">'
      + this.charSVG(ch.id, {}, {}, 'garden', 'home-mascot')
      + '<h1 class="home-title">小小服装设计师</h1>'
      + '<p class="home-sub">给小动物穿得漂漂亮亮</p>'
      + '<div class="home-btns">'
      + '<button class="btn btn-primary" data-act="go" data-v="tasks">开始设计</button>'
      + '<button class="btn btn-yellow" data-act="free">自由搭配</button>'
      + '<button class="btn" data-act="go" data-v="works">我的作品</button>'
      + '<button class="btn" data-act="go" data-v="books">我的字章</button>'
      + '</div></div>'
      + '<button class="hold" data-act="parent">⚙</button>';
  },

  viewChar() {
    const st = Storage.data.stars;
    let cards = '';
    for (const c of CHARACTERS) {
      const lock = st < c.unlockStars;
      cards += '<div class="card' + (this.charId === c.id ? ' sel' : '') + (lock ? ' locked' : '') + '"'
        + (lock ? '' : ' data-act="pickChar" data-v="' + c.id + '"') + '>'
        + charAvatar(c)
        + '<div class="card-name">' + c.name + '</div>'
        + '<div class="card-sub">' + (lock ? '★' + c.unlockStars + ' 解锁' : c.py) + '</div></div>';
    }
    return this.bar('选一个小动物', 'home')
      + '<div class="screen"><div class="pad"><div class="grid2">' + cards + '</div>'
      + '<div style="height:12px"></div>'
      + '<button class="btn btn-primary" style="width:100%" data-act="startTask">就它啦，开始</button>'
      + '</div></div>';
  },

  viewTasks() {
    const LINE = { life: '生活', number: '数数·逻辑', word: '汉字' };
    let list = '';
    for (const t of TASKS) {
      const done = Storage.data.doneTasks.indexOf(t.id) >= 0;
      list += '<div class="task' + (done ? ' done' : '') + '" data-act="startTask" data-v="' + t.id + '">'
        + '<div class="task-no">' + (done ? '✓' : t.id) + '</div>'
        + '<div class="task-body"><div class="task-title">' + t.title + '</div>'
        + '<div class="task-hint">' + t.hint + '</div>'
        + '<span class="task-tag">' + (LINE[t.line] || '') + ' · 字章「' + t.stamp + '」</span></div>'
        + '<div style="font-size:22px">' + (done ? '⭐' : '›') + '</div></div>';
    }
    return this.bar('今天做什么', 'home')
      + '<div class="task-list">' + list + '</div>';
  },

  /* ---------- 换装（wear 任务 + 自由模式） ---------- */
  viewPlay() {
    const t = this.task;
    const isFree = this.free;
    const prompt = isFree ? '想怎么穿就怎么穿' : t.title;
    const hint = isFree ? '点下面的格子给小动物穿上，点颜色可以换颜色' : t.hint;

    // 插槽
    let slots = '';
    for (const s of SLOTS) {
      const on = this.curSlot === s.key;
      const isAcc = s.key === 'acc';
      const list = Array.isArray(this.outfit[s.key]) ? this.outfit[s.key] : (this.outfit[s.key] ? [this.outfit[s.key]] : []);
      const has = isAcc ? list.length > 0 : !!this.outfit[s.key];
      const dotBg = isAcc
        ? (list.length ? (this.colors.accById && this.colors.accById[list[0]]) || this.colors.acc : 'transparent')
        : (has ? this.colors[s.key] : 'transparent');
      const badge = isAcc && list.length > 1 ? '<span class="slot-badge">' + list.length + '</span>' : '';
      slots += '<button class="slot' + (on ? ' on' : '') + '" data-act="slot" data-v="' + s.key + '">'
        + '<span class="dot" style="background:' + dotBg + '"></span>'
        + s.name + badge + '</button>';
    }

    // 当前插槽的服饰（不引导、不高亮，孩子想穿啥就穿啥）
    let items = '';
    const list = CLOTHES[this.curSlot] || [];
    const isAccSlot = this.curSlot === 'acc';
    const curArr = isAccSlot
      ? (Array.isArray(this.outfit.acc) ? this.outfit.acc : [])
      : [];

    items += '<div class="item-row">';
    /* 配饰不是「切换」而是「叠加」，不放「不穿」格；想清空就用底部「全部取下」 */
    if (!isAccSlot) {
      items += '<div class="item' + (!this.outfit[this.curSlot] ? ' on' : '') + '" data-act="wear" data-v="">'
        + '<div class="item-ic">' + this.icon('布', 40) + '</div><div class="item-nm">不穿</div></div>';
    } else {
      items += '<div class="item acc-clear" data-act="clearAcc">'
        + '<div class="item-ic">✕</div><div class="item-nm">取下全部</div></div>';
    }
    for (const it of list) {
      const on = isAccSlot ? curArr.indexOf(it.id) >= 0 : (this.outfit[this.curSlot] === it.id);
      const act = isAccSlot ? 'toggleAcc' : 'wear';
      const vAttr = isAccSlot ? it.id : it.id;
      const check = isAccSlot && on ? '<span class="item-check">✓</span>' : '';
      items += '<div class="item' + (on ? ' on' : '') + '" data-act="' + act + '" data-v="' + vAttr + '">'
        + '<div class="item-ic">' + this.icon(it.word, 40) + '</div>'
        + '<div class="item-nm">' + it.name + '</div>'
        + '<div class="item-w">' + it.word + '</div>'
        + check + '</div>';
    }
    items += '</div>';

    let pal = '';
    if (this.curSlot === 'acc') {
      const accMap = this.colors.accById || (this.colors.accById = {});
      /* 额外一格「清空颜色」，方便个别还原 */
      pal += '<button class="sw sw-clear' + (Object.keys(accMap).length === 0 ? ' on' : '') + '" data-act="accColorNone" title="不指定颜色"></button>';
      for (const c of COLORS) {
        const on = Object.keys(accMap).length > 0 && Object.keys(accMap).every((k) => accMap[k] === c.hex);
        pal += '<button class="sw' + (on ? ' on' : '') + '" '
          + 'style="background:' + c.hex + '" data-act="color" data-v="' + c.hex + '" data-w="' + c.word + '"></button>';
      }
    } else {
      for (const c of COLORS) {
        pal += '<button class="sw' + (this.colors[this.curSlot] === c.hex ? ' on' : '') + '" '
          + 'style="background:' + c.hex + '" data-act="color" data-v="' + c.hex + '" data-w="' + c.word + '"></button>';
      }
    }

    const pop = this.popWord
      ? '<div class="stage-word"><div class="sw-char">' + this.popWord + '</div><div class="sw-py">' + (WORD_MAP[this.popWord] ? WORD_MAP[this.popWord].p : '') + '</div></div>'
      : '';

    return this.bar(isFree ? '自由搭配' : '第 ' + t.id + ' 关', isFree ? 'home' : 'tasks')
      + '<div class="screen">'
      + '<div class="stage">' + this.charSVG(this.charId, this.outfit, this.colors, this.sceneId) + pop + '</div>'
      + '<div class="tip">' + prompt + '<br><span style="font-weight:600;color:var(--ink2);font-size:13px">' + hint + '</span></div>'
      + '<div class="tray"><div class="tray-top"><div class="slots">' + slots + '</div></div>'
      + '<div class="items"><div class="item-row">' + items + '</div></div>'
      + '<div class="palette-bar">' + pal + '</div>'
      + '</div>'
      // 完成按钮：永远可点，孩子自己决定穿什么
      + '<button class="fab-finish" data-act="finish">完成啦 ✓</button>'
      + '</div>';
  },

  /* ---------- 题面（count / choice / multi / compose） ---------- */
  viewQuiz() {
    const t = this.task;
    let body = '';

    if (t.type === 'count') {
      let row = '';
      for (let i = 0; i < this.count; i++) row += this.icon(t.icon || '星', 44);
      body = '<div class="q-prompt">' + t.title + '</div>'
        + '<div class="count-n">' + this.count + ' / ' + t.target + ' ' + (t.unit || '') + '</div>'
        + '<div class="count-row">' + row + '</div>'
        + '<button class="tap-big" data-act="tap">' + this.icon(t.icon || '星', 56) + '</button>'
        + '<div style="height:10px"></div>'
        + '<button class="btn btn-ghost btn-sm" style="width:100%" data-act="resetCount">重新数</button>';

    } else if (t.type === 'choice') {
      if (t.bigWord) body += '<div class="q-big">' + t.bigWord + '</div>';
      if (t.sample) {
        body += '<div class="q-prompt">上面这个是：</div><div style="text-align:center;margin:6px 0">'
          + this.icon(t.sample.w, 62) + '</div>';
      }
      if (t.sequence) {
        let sq = '<div class="q-seq">';
        for (const c of t.sequence) sq += '<div class="seq-d" style="background:' + c + '"></div>';
        sq += '<div class="seq-q">?</div></div>';
        body += sq;
      }
      body += '<div class="q-prompt">' + t.title + '</div>';
      body += '<div class="q-opts">';
      t.options.forEach((o, i) => {
        body += '<div class="q-opt" data-act="pick" data-v="' + i + '">'
          + (o.c
            ? '<div class="seq-d" style="background:' + o.c + ';width:56px;height:56px"></div>'
            : '<div class="q-ic">' + this.icon(o.w, 56) + '</div>')
          + '<div class="q-lb">' + (o.w || '') + '</div></div>';
      });
      body += '</div>';

    } else if (t.type === 'multi') {
      body = '<div class="q-prompt">' + t.title + '</div>'
        + '<div class="q-opts">';
      t.options.forEach((o, i) => {
        const on = this.chosen.indexOf(i) >= 0;
        body += '<div class="q-opt' + (on ? ' on' : '') + '" data-act="toggle" data-v="' + i + '">'
          + '<div class="q-ic" style="color:' + (t.colors ? t.colors[i] : 'var(--ink)') + '">' + this.icon(o.w, 56) + '</div>'
          + '<div class="q-lb">' + o.w + '</div></div>';
      });
      body += '</div>'
        + '<button class="btn btn-ok" style="width:100%" data-act="checkMulti">放进去</button>';

    } else if (t.type === 'compose') {
      let sent = '<div class="sent">';
      for (const c of t.sentence) {
        if (c === null) {
          const pick = this.chosen.length ? t.blankOptions[this.chosen[0]].w : '？';
          sent += '<div class="sent-c blank">' + pick + '</div>';
        } else {
          sent += '<div class="sent-c">' + c + '</div>';
        }
      }
      sent += '</div>';
      let blank = '<div class="q-opts">';
      t.blankOptions.forEach((o, i) => {
        blank += '<div class="q-opt' + (this.chosen[0] === i ? ' on' : '') + '" data-act="pick" data-v="' + i + '">'
          + '<div class="seq-d" style="background:' + o.c + ';width:56px;height:56px"></div>'
          + '<div class="q-lb">' + o.w + '</div></div>';
      });
      blank += '</div>';
      body = '<div class="q-prompt">' + t.title + '</div>' + sent
        + '<div style="height:8px"></div>' + blank
        + '<button class="btn btn-ok" style="width:100%" data-act="checkCompose">读一读</button>';
    }

    return this.bar('第 ' + t.id + ' 关', 'tasks')
      + '<div class="screen">'
      + '<div class="stage">' + this.charSVG(this.charId, this.outfit, this.colors, t.scene || 'room') + '</div>'
      + '<div class="quiz">' + body + '</div></div>';
  },

  /* ---------- 作品集 ---------- */
  viewWorks() {
    const ws = Storage.data.works;
    if (!ws.length) {
      return this.bar('我的作品', 'home')
        + '<div class="empty">还没有作品哦<br>去「开始设计」给小动物穿一身漂亮衣服吧</div>';
    }
    let g = '<div class="works-grid">';
    for (const w of ws) {
      g += '<div class="work">' + this.charSVG(w.char, w.outfit, w.colors, w.scene)
        + '<div class="work-ft">字章「' + w.stamp + '」</div></div>';
    }
    g += '</div>';
    return this.bar('我的作品（' + ws.length + '）', 'home') + '<div class="works">' + g + '</div>';
  },

  /* ---------- 集章册 ---------- */
  viewBooks() {
    const cur = Storage.data.level;
    const learned = Storage.data.learned;
    let h = '';

    // 只显示当前级别及以前，更高级别完全不可见（不制造"还剩几百字"的压力）
    for (let lv = 1; lv <= 10; lv++) {
      if (lv > cur) break;
      const ws = WORDS.filter((w) => w.lv === lv);
      const got = ws.filter((w) => learned.indexOf(w.c) >= 0).length;
      h += '<div class="book-lv"><div class="book-hd"><span>第 ' + lv + ' 级</span><span style="color:var(--ink2)">' + got + ' / ' + ws.length + '</span></div><div class="book-grid">';
      for (const w of ws) {
        const has = learned.indexOf(w.c) >= 0;
        h += '<div class="chip' + (has ? ' got' : ' locked') + '" data-act="say" data-v="' + w.c + '">'
          + (has ? w.c + '<small>' + w.p + '</small>' : '<span style="font-size:19px">?</span>') + '</div>';
      }
      h += '</div></div>';
    }

    // 额外收获：做任务时提前遇到的更高级别的字（如雪地关的「冬」在第 3 级）
    const extra = learned.map((c) => WORD_MAP[c]).filter((w) => w && w.lv > cur);
    if (extra.length) {
      h += '<div class="book-lv"><div class="book-hd"><span>额外收获</span><span style="color:var(--ink2)">' + extra.length + ' 个</span></div><div class="book-grid">';
      for (const w of extra) {
        h += '<div class="chip got" data-act="say" data-v="' + w.c + '">' + w.c + '<small>' + w.p + '</small></div>';
      }
      h += '</div></div>';
    }

    if (cur < 10) h += '<div class="empty">后面还有更多字<br>把这一级学完就会自动打开</div>';
    return this.bar('我的字章', 'home') + '<div class="books">' + h + '</div>';
  },

  /* ---------- 睡眠 / 休息 / 护眼 ---------- */
  viewSleep() {
    const s = Storage.data.settings;
    return '<div class="screen sleep"><div class="sleep-emo">🌙</div>'
      + '<h1 class="home-title">小动物们睡着啦</h1>'
      + '<p class="home-sub">睡觉时间（' + s.sleepStart + ' - ' + s.sleepEnd + '）<br>明天早上再来找它们玩吧</p>'
      + '<button class="btn btn-ghost btn-sm" data-act="go" data-v="parent">家长设置</button></div>';
  },

  viewRest() {
    const why = this.restWhy;
    const txt = why === 'daily'
      ? '今天玩的时间到啦，明天再来哦'
      : '玩了好一会儿啦，让眼睛休息一下吧';
    return '<div class="screen sleep">'
      + '<div class="sleep-emo">😴</div>'
      + '<h1 class="home-title">' + txt + '</h1>'
      + '<p class="home-sub">小动物要去睡午觉了<br>你可以先看看自己的作品</p>'
      + '<div style="width:100%;max-width:320px;display:flex;flex-direction:column;gap:12px">'
      + '<button class="btn btn-yellow" data-act="go" data-v="works">看看我的作品</button>'
      + '<button class="btn btn-ghost" data-act="go" data-v="parent">家长：再玩一会儿</button>'
      + '</div></div>';
  },

  viewEye() {
    return '<div class="screen sleep"><div class="sleep-emo">👀</div>'
      + '<h1 class="home-title">看看远处</h1>'
      + '<p class="home-sub">和小动物一起眨眨眼<br>看看窗外的树，数三下</p>'
      + '<button class="btn btn-primary" data-act="eyeDone">好啦，继续玩</button></div>';
  },

  /* ---------- 家长中心 ---------- */
  viewParent() {
    const s = Storage.data.settings;
    const dayLv = [20, 30, 45, 60];
    const sesLv = [10, 15, 20, 30];
    const todayMin = Math.round(Storage.data.today.ms / 60000);

    let h = this.bar('家长中心', 'home')
      + '<div class="pc">';

    if (!Speech.ok) {
      h += '<div class="warn">⚠️ 这台设备没有中文语音包，汉字不会发音。<br>可在「设置 → 语言和输入法 → 文字转语音」里安装中文语音，或装一个中文 TTS 引擎。</div>';
    }
    if (!Storage.available) {
      h += '<div class="warn">⚠️ 当前浏览器不允许保存进度（' + Storage.reason + '）。<br>建议用 <b>Chrome</b> 打开，并把本文件放在<b>固定文件夹</b>、每次从同一位置打开，否则星星和作品会丢失。</div>';
    }

    h += '<div class="row"><div><div class="row-l">今日已玩</div><div class="row-s">' + todayMin + ' 分钟 / 上限 ' + s.dailyLimit + ' 分钟</div></div>'
      + '<div class="seg"><button data-act="extend">再玩 15 分钟</button></div></div>';

    h += '<div class="row"><div><div class="row-l">每天总共能玩</div><div class="row-s">到时间后当天不能再玩</div></div>'
      + '<div class="seg">';
    for (const v of dayLv) h += '<button class="' + (s.dailyLimit === v ? 'on' : '') + '" data-act="setDaily" data-v="' + v + '">' + v + '分</button>';
    h += '</div></div>';

    h += '<div class="row"><div><div class="row-l">一次能玩多久</div><div class="row-s">到点会播放收尾动画</div></div>'
      + '<div class="seg">';
    for (const v of sesLv) h += '<button class="' + (s.sessionLimit === v ? 'on' : '') + '" data-act="setSession" data-v="' + v + '">' + v + '分</button>';
    h += '</div></div>';

    h += '<div class="row"><div><div class="row-l">睡觉时间</div><div class="row-s">' + s.sleepStart + ' - ' + s.sleepEnd + ' 直接锁住</div></div>'
      + '<div class="seg">'
      + '<button data-act="setSleep" data-v="20:30-07:30">早睡</button>'
      + '<button data-act="setSleep" data-v="21:00-07:00">默认</button>'
      + '<button data-act="setSleep" data-v="21:30-07:00">晚睡</button>'
      + '</div></div>';

    h += '<div class="row"><div><div class="row-l">字表级别</div><div class="row-s">当前第 ' + Storage.data.level + ' 级，共 10 级</div></div>'
      + '<div class="seg">'
      + '<button data-act="setLevel" data-v="-1">−</button>'
      + '<button data-act="setLevel" data-v="0">' + Storage.data.level + '</button>'
      + '<button data-act="setLevel" data-v="1">＋</button>'
      + '</div></div>';

    h += '<div class="row"><div><div class="row-l">汉字发音</div><div class="row-s">' + (Speech.ok ? '可用' : '不可用') + '</div></div>'
      + '<div class="seg"><button class="' + (Speech.enabled ? 'on' : '') + '" data-act="toggleSpeech">' + (Speech.enabled ? '开' : '关') + '</button></div></div>';

    h += '<div class="row"><div><div class="row-l">给宝贝的一句话</div><div class="row-s">' + (Storage.data.praise ? '已设置' : '完成后会弹出来') + '</div></div>'
      + '<div class="seg"><button data-act="setPraise">' + (Storage.data.praise ? '改一句' : '录一句') + '</button></div></div>';

    h += '<div class="row"><div><div class="row-l">导出存档</div><div class="row-s">存成文件，换手机时可恢复</div></div>'
      + '<div class="seg"><button data-act="export">导出</button><button data-act="import">导入</button></div></div>';

    h += '<div class="row"><div><div class="row-l">进度</div><div class="row-s">★ ' + Storage.data.stars + ' · 字章 ' + Storage.data.learned.length + ' · 作品 ' + Storage.data.works.length + ' 件</div></div>'
      + '<div class="seg"><button data-act="reset">清空</button></div></div>';

    h += '<div style="height:8px"></div>'
      + '<button class="btn btn-primary" style="width:100%" data-act="go" data-v="home">回到游戏</button>'
      + '<div style="height:20px"></div></div>';
    return h;
  },

  /* ================= 交互 ================= */
  /** 工具：关掉当前所有弹窗。跳转类动作前必须先调用，避免「下一个」被印章弹窗挡住 */
  killModal() {
    const ov = document.querySelectorAll('.overlay');
    for (let i = 0; i < ov.length; i++) ov[i].remove();
  },
  handle(act, v, t) {
    // 跳转类动作（go / free / parent / extend / setXxx / play / startTask 等会换 view 的）
    // 一律先把屏上的 modal 清掉，避免弹窗挡住新页面导致「卡住」假象
    if (['go', 'free', 'parent', 'extend', 'startTask', 'setDaily', 'setSession', 'setSleep', 'setLevel', 'setPraise', 'reset', 'export', 'import', 'parent', 'pull'].indexOf(act) >= 0) {
      this.killModal();
    }
    switch (act) {
      case 'go':
        if (v === 'home') { this.task = null; this.free = false; }
        if (v === 'play' || v === 'quiz') { /* 由各自入口设置 */ }
        this.state = v;
        this.render();
        break;

      case 'parent':
        this.state = 'parent'; this.render(); break;

      case 'free':
        this.free = true; this.task = null;
        this.outfit = { top: null, bottom: null, shoes: null, hat: null, acc: [] };
        this.colors.accById = {};
        this.curSlot = 'top';
        const g1 = Parent.canPlay();
        if (!g1.ok) { this.state = g1.reason === 'sleep' ? 'sleep' : 'rest'; this.restWhy = g1.reason === 'sleep' ? '' : 'daily'; }
        else { this.state = 'char'; }
        this.render();
        break;

      case 'pickChar':
        this.charId = v; this.render(); break;

      case 'startTask': {
        const g = Parent.canPlay();
        if (!g.ok) { this.state = g.reason === 'sleep' ? 'sleep' : 'rest'; this.restWhy = g.reason === 'sleep' ? '' : 'daily'; this.render(); return; }
        if (v) {
          const tk = TASKS.filter((x) => String(x.id) === String(v))[0];
          if (!tk) return;
          // 汉字关每天限 3 次
          if (tk.line === 'word' && (Storage.data.today.wc || 0) >= 3) {
            this.modal('今天认字够啦', '汉字关一天最多玩 3 次，明天再来吧～', [{ t: '好', a: 'closeModal', c: 'btn-primary' }]);
            return;
          }
          this.task = tk; this.free = false;
          this.charId = tk.char; this.sceneId = tk.scene || 'room';
          this.count = 0; this.chosen = [];
          this.outfit = { top: null, bottom: null, shoes: null, hat: null, acc: [] };
          this.colors.accById = {};
          this.state = tk.type === 'wear' ? 'play' : 'quiz';
          Parent.reset();
          Speech.speak(tk.title + '。' + tk.hint);
        } else {
          this.state = 'play';
        }
        this.render();
        break;
      }

      case 'slot':
        this.curSlot = v; this.render(); break;

      case 'wear': {
        this.outfit[this.curSlot] = v || null;
        if (v) {
          const d = CLOTH_MAP[v];
          this.popWord = d.word;
          Speech.speak(d.name);
        } else this.popWord = null;
        this.render();
        break;
      }

      case 'toggleAcc': {
        const arr = Array.isArray(this.outfit.acc) ? this.outfit.acc : [];
        const at = arr.indexOf(v);
        if (at >= 0) {
          /* 取消勾选时也把这个配饰独立存的颜色清掉 */
          if (this.colors.accById) delete this.colors.accById[v];
          arr.splice(at, 1);
        } else {
          arr.push(v);
          const d = CLOTH_MAP[v];
          if (d) { this.popWord = d.word; Speech.speak(d.name); }
        }
        this.outfit.acc = arr;
        this.render();
        break;
      }

      case 'clearAcc': {
        this.outfit.acc = [];
        this.colors.accById = {};
        this.popWord = null;
        this.render();
        break;
      }

      case 'color':
        if (this.curSlot === 'acc') {
          /* 应用到当前所有已选配饰 */
          const arr = Array.isArray(this.outfit.acc) ? this.outfit.acc : [];
          const map = this.colors.accById || (this.colors.accById = {});
          for (const id of arr) map[id] = v;
          this.popWord = t.dataset.w || null;
          if (this.popWord) Speech.speak(this.popWord);
        } else {
          this.colors[this.curSlot] = v;
          this.popWord = t.dataset.w || null;
          if (this.popWord) Speech.speak(this.popWord);
        }
        this.render();
        break;

      case 'accColorNone':
        this.colors.accById = {};
        this.render();
        break;

      case 'say':
        this.popWord = v;
        Speech.speak(v);
        this.modal(v, WORD_MAP[v] ? WORD_MAP[v].p + ' · ' + WORD_MAP[v].e : '',
          [{ t: '再听一次', a: 'sayAgain', v: v, c: 'btn-yellow' }, { t: '好', a: 'closeModal', c: 'btn-primary' }]);
        break;

      case 'sayAgain': Speech.speak(v); break;

      case 'tap':
        this.count++;
        Speech.speak(String(this.count));
        if (this.count >= this.task.target) this.win();
        else this.render();
        break;

      case 'resetCount': this.count = 0; this.render(); break;

      case 'pick': {
        const i = parseInt(v, 10);
        const t2 = this.task;
        if (t2.type === 'compose') { this.chosen = [i]; this.render(); return; }
        if (i === t2.answer) { this.win(); }
        else {
          this.chosen = [];
          t.classList.add('bad');
          setTimeout(() => { t.classList.remove('bad'); }, 420);
          if (window.navigator.vibrate) { try { window.navigator.vibrate(30); } catch (e) { /* 忽略 */ } }
        }
        break;
      }

      case 'toggle': {
        const i = parseInt(v, 10);
        const at = this.chosen.indexOf(i);
        if (at >= 0) this.chosen.splice(at, 1); else this.chosen.push(i);
        this.render();
        break;
      }

      case 'checkMulti': {
        const t3 = this.task;
        const a = (t3.answers || []).slice().sort().join(',');
        const b = this.chosen.slice().sort().join(',');
        if (a === b) this.win();
        else this.modal('再看看', '还有红色的没放进去哦', [{ t: '好', a: 'closeModal', c: 'btn-primary' }]);
        break;
      }

      case 'checkCompose':
        if (this.chosen.length && this.chosen[0] === this.task.answer) this.win();
        else this.modal('再想想', '太阳是什么颜色的呀', [{ t: '好', a: 'closeModal', c: 'btn-primary' }]);
        break;

      case 'finish': {
        // 孩子自己决定穿什么，穿任何一套都算完成。任务卡只是提供"情境灵感"。
        this.win();
        break;
      }

      case 'eyeDone':
        this.state = this.prevState || 'play'; this.render(); break;

      case 'extend':
        Parent.extend();
        this.state = 'home'; this.render();
        this.modal('已延长', '可以继续玩 15 分钟', [{ t: '好', a: 'closeModal', c: 'btn-primary' }]);
        break;

      case 'setDaily': Storage.data.settings.dailyLimit = parseInt(v, 10); Storage.save(); this.render(); break;
      case 'setSession': Storage.data.settings.sessionLimit = parseInt(v, 10); Storage.save(); this.render(); break;
      case 'setSleep': {
        const p = String(v).split('-');
        Storage.data.settings.sleepStart = p[0];
        Storage.data.settings.sleepEnd = p[1];
        Storage.save(); this.render(); break;
      }
      case 'setLevel': {
        const d = parseInt(v, 10);
        const n = Math.min(10, Math.max(1, Storage.data.level + d));
        Storage.data.level = n; Storage.save(); this.render(); break;
      }
      case 'toggleSpeech': Speech.enabled = !Speech.enabled; this.render(); break;

      case 'setPraise': {
        const cur = Storage.data.praise || '';
        const val = window.prompt('写一句想对宝贝说的话（完成后会弹出来）', cur);
        if (val !== null) { Storage.data.praise = val.slice(0, 40); Storage.save(); this.render(); }
        break;
      }

      case 'export': {
        const blob = new Blob([Storage.exportJSON()], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = '小小服装设计师-存档-' + new Date().toISOString().slice(0, 10) + '.json';
        document.body.appendChild(a); a.click();
        setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
        break;
      }

      case 'import': {
        const inp = document.createElement('input');
        inp.type = 'file'; inp.accept = '.json,application/json';
        inp.onchange = () => {
          const f = inp.files && inp.files[0];
          if (!f) return;
          const r = new FileReader();
          r.onload = () => {
            const res = Storage.importJSON(String(r.result));
            this.modal(res.ok ? '恢复成功' : '没能恢复', res.msg, [{ t: '好', a: 'closeModal', c: 'btn-primary' }]);
            this.render();
          };
          r.readAsText(f);
        };
        inp.click();
        break;
      }

      case 'reset':
        if (window.confirm('确定清空所有星星、字章和作品吗？此操作不可恢复。')) {
          Storage.data.stars = 0; Storage.data.learned = [];
          Storage.data.works = []; Storage.data.doneTasks = [];
          Storage.data.level = 1; Storage.save(); this.render();
        }
        break;

      case 'closeModal':
        const m = document.querySelector('.overlay');
        if (m) m.remove();
        break;
    }
  },

  /* ================= 完成一关 ================= */
  win() {
    const t = this.task;
    /* 自由模式：首选第一件配饰的字章；没有就 fall back 到 top；再没有用「衣」 */
    let stamp;
    if (this.free) {
      const accs = Array.isArray(this.outfit.acc) ? this.outfit.acc : [];
      if (accs.length) stamp = (CLOTH_MAP[accs[0]] || {}).word;
      else if (this.outfit.top) stamp = (CLOTH_MAP[this.outfit.top] || {}).word;
      else stamp = '衣';
    } else stamp = t.stamp;
    const first = Storage.data.doneTasks.indexOf(t ? t.id : 0) < 0;

    if (t) {
      if (first) {
        Storage.data.doneTasks.push(t.id);
        Storage.addStar(1);
        if (t.line === 'word') Storage.data.today.wc = (Storage.data.today.wc || 0) + 1;
      }
      // 学满当前级别的字数 → 自动升到下一级
      const lvWords = WORDS.filter((w) => w.lv === Storage.data.level);
      const gotLv = lvWords.filter((w) => Storage.data.learned.indexOf(w.c) >= 0).length;
      if (gotLv >= lvWords.length - 1 && Storage.data.level < 10) {
        Storage.data.level++;
      }
    }
    const isNew = Storage.addLearned(stamp);

    // 存作品（wear 类与自由模式）
    if (!t || t.type === 'wear') {
      Storage.addWork({
        char: this.charId, scene: this.sceneId,
        outfit: JSON.parse(JSON.stringify(this.outfit)),
        colors: JSON.parse(JSON.stringify(this.colors)),
        stamp: stamp, at: Date.now(),
      });
    }
    Storage.save();

    const w = WORD_MAP[stamp] || { p: '', e: '' };
    Speech.speak(stamp);

    let extra = '';
    if (Storage.data.praise) extra = '<div class="praise">💛 ' + Storage.data.praise + '</div>';

    this.modal(
      first ? '太棒啦！' : '又完成一次',
      (isNew ? '你得到了一个新的字章' : '这个字章你已经有了') + '，★ +1',
      [
        { t: '看看作品', a: 'go', v: 'works', c: 'btn-ghost' },
        { t: '下一个', a: 'go', v: 'tasks', c: 'btn-primary' },
      ],
      '<div class="stamp"><div class="stamp-c">' + stamp + '</div><div class="stamp-p">' + w.p + '</div></div>' + extra
    );

    // 5 秒后没动，自动带她到任务列表——孩子就算看不懂按钮也不会卡住
    clearTimeout(this._autoNext);
    this._autoNext = setTimeout(() => {
      if (this.state === 'home') return; // 已被手动点掉（modal 消失）
      const ov = document.querySelector('.overlay');
      if (!ov) return;
      // 只在当前还是「印章弹窗」时自动跳，避免跳到不该跳的地方
      if (ov.querySelector('.stamp')) this.state = 'tasks', this.render();
    }, 5000);
  },

  modal(title, desc, btns, extraHTML) {
    const old = document.querySelector('.overlay');
    if (old) old.remove();
    let b = '';
    for (const x of btns || []) {
      b += '<button class="btn ' + (x.c || '') + '" data-act="' + x.a + '"' + (x.v ? ' data-v="' + x.v + '"' : '') + '>' + x.t + '</button>';
    }
    const d = document.createElement('div');
    d.className = 'overlay';
    d.innerHTML = '<div class="modal">' + (extraHTML || '')
      + '<h2>' + title + '</h2><p>' + desc + '</p>'
      + '<div style="display:flex;flex-direction:column;gap:10px">' + b + '</div></div>';
    document.body.appendChild(d);
  },
};

/* 暴露到 window：方便在手机浏览器里调试，也方便自动化测试 */
window.App = App;
window.Storage = Storage;
window.Parent = Parent;
window.Speech = Speech;
window.WORDS = WORDS;
window.ICONS = ICONS;
window.CHARACTERS = CHARACTERS;
window.CLOTH_MAP = CLOTH_MAP;
window.TASKS = TASKS;

window.addEventListener('DOMContentLoaded', () => App.init());
if (document.readyState !== 'loading') { if (!App.el) App.init(); }


/* ===== sw-register.js ===== */
/**
 * Service Worker 注册：让游戏能离线运行、可被"添加到主屏幕"
 * 仅在 HTTPS 或 localhost 环境下生效（file:// 协议不支持 SW）
 */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js')
      .then((reg) => {
        console.log('SW 已注册：', reg.scope);
      })
      .catch((err) => {
        console.log('SW 注册失败（离线仍可运行 index.html 本身）：', err);
      });
  });
}

</script>
</body>
</html>
